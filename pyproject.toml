[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "url-document-analyzer"
version = "1.0.0"
description = "Analyze URLs in Excel files: detect PDFs, extract metadata."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "langdetect>=1.0.9",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.0",
    "flask>=3.0.0",
]

[project.scripts]
url-analyzer = "url_analyzer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
